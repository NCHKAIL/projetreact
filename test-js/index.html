<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mise en page : Banner, Sidebar, RightColumn, Footer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">

    <!-- Banner -->
    <header class="banner">
      <h1>Ma boutique</h1>
      <nav>
        <a href="#">Accueil</a>
        <a href="#">Produits</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <!-- Colonne gauche (Sidebar) -->
    <aside class="sidebar">
      <h2>Catégories</h2>
      <ul>
        <li><a href="#">Claviers</a></li>
        <li><a href="#">Souris</a></li>
        <li><a href="#">Écrans</a></li>
      </ul>
    </aside>

    <!-- Contenu central -->
    <main class="content">
      <h2>Produits</h2>
      <div class="carte">
        <h3>Clavier</h3>
        <p>49 €</p>
      </div>
      <div class="carte">
        <h3>Souris</h3>
        <p>25 €</p>
      </div>
    </main>

    <!-- Colonne droite (RightColumn) -->
    <aside class="right-column">
      <h2>Panier</h2>
      <p>2 articles</p>
      <p>Total : 74 €</p>
    </aside>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 Ma boutique. Tous droits réservés.</p>
    </footer>

  </div>
</body>
</html>
